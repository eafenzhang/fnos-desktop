[package]
name = "fnos-desktop"
version = "0.3.0"
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# T14d：`unstable` 开启多 Webview（`Window::add_child`）——标签页栏 = 独立 Webview，
# 每个标签页 = 主窗口里的一个子 Webview。这是 tauri 2 对多 Webview 的门（桌面端稳定可用）。
tauri = { version = "2", features = ["tray-icon", "image-png", "unstable"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Finding 1：`config.rs` 要真正校验 `homeUrl` / `nasUrl`。`tauri::Url` 就是 `url::Url`
# （`tauri-2.12.0/src/lib.rs:92` 的 `pub use url::Url`），版本由 tauri 统一到同一个 2.x，
# 因此两个类型可直接互用、无需转换。
url = "2"
# T14c 修复轮 21：托盘「检查更新」——拉 GitHub Releases 的 latest 比对版本号。阻塞式
# HTTP 放在 `spawn_blocking` 里跑；升级动作本身由用户在浏览器里完成，本壳不下载不安装。
ureq = { version = "2", default-features = true }

[target.'cfg(windows)'.dependencies]
# 原生 MessageBoxW：检查结果要能从托盘动作直接反馈给用户（release 无控制台，
# 主窗口页面也不是放这条消息的地方——那是 fnOS 的 WebUI）。
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
