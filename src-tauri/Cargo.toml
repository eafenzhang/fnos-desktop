[package]
name = "fnos-desktop"
version = "0.3.18"
edition = "2021"
build = "build.rs"

[build-dependencies]
# 多 Webview 依赖 tauri 2.12 的 unstable API（Window::add_child / NewWindowResponse::Create）；
# 精确锁定，避免一次 cargo update 把 2.13 的破坏性变更带进来。
tauri-build = { version = "=2.7.0", features = [] }

[dependencies]
# T14d：`unstable` 开启多 Webview（`Window::add_child`）——标签页栏 = 独立 Webview，
# 每个标签页 = 主窗口里的一个子 Webview。这是 tauri 2 对多 Webview 的门（桌面端稳定可用）。
tauri = { version = "=2.12.0", features = ["tray-icon", "image-png", "unstable"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Finding 1：`config.rs` 要真正校验 `homeUrl` / `nasUrl`。`tauri::Url` 就是 `url::Url`
# （`tauri-2.12.0/src/lib.rs:92` 的 `pub use url::Url`），版本由 tauri 统一到同一个 2.x，
# 因此两个类型可直接互用、无需转换。
url = "2"
# T14c 修复轮 21：托盘「检查更新」——拉 GitHub Releases 的 latest 比对版本号。阻塞式
# HTTP 放在 `spawn_blocking` 里跑；升级动作本身由用户在浏览器里完成，本壳不下载不安装。
ureq = { version = "2", default-features = true }
# P1-5：安装包完整性校验。配上 `shell.updateMirrorPrefix` 之后，GitHub 的 HTTPS 不再是
# 唯一来源，下载完必须拿 release API 的 `assets[].digest`（sha256）比对一次再执行。
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
# 原生 MessageBoxW：检查结果要能从托盘动作直接反馈给用户（release 无控制台，
# 主窗口页面也不是放这条消息的地方——那是 fnOS 的 WebUI）。
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
# 全屏悬浮标题栏：通过 Tauri 的 PlatformWebview::controller() 调 ParentWindow 拿子窗口
# HWND，再用 SetWindowPos 提到内容 Webview 之上。webview2-com 是 tauri 的传递依赖，
# 不在本清单重复声明（避免将来锁出第二份版本）。

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
