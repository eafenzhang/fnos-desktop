<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>fnOS 设置</title>
<link rel="stylesheet" href="settings.css">
</head>
<body>
<div class="shell">
  <section class="upstream" aria-label="上游设置界面">
    <!--
      Task 14b：设置窗的**主界面**是上游原样的 popup UI。
      `popup.html` 与 vendored 副本逐字节相同，只多插入一行
      `<script src="./chrome-shim.js"></script>`（见 tools/vendor-mods.ps1 与 NOTICE 的
      包装性改动第 7 条）：chrome.* 兼容层必须在上游 popup.js 之前定义 window.chrome。
      装进 iframe 的理由有两条：① 上游 UI 的字节一个都不改（它自带 body 尺寸与整套样式）；
      ② 它的样式因此不可能与窗外的东西互相打架。
      帧在拿到配置快照之后才创建（见 app.js::mountUpstreamFrame）：上游在脚本开头就同步读
      `chrome.runtime.getManifest().version`，所以快照必须先就位。
      T14c 修复轮 3：按用户要求，设置窗**只保留上游界面**——状态条、外壳开关（注入总开关
      / nasUrl）与关于/合规页全部删除；「自动隐藏 Dock」由 chrome-shim 以上游自己的行样式
      注入到上游界面里（siteToggle 行之后）。
    -->
    <div id="upstreamHost" class="frame-host" data-state="loading">
      <p class="frame-note" id="upstreamNote">正在读取配置…</p>
    </div>
  </section>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
